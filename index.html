<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interval Alarm</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#16221d;--mute:#5d6b65;--line:#d5ded9;--accent:#0f6b52;--accent-ink:#fff;--warn:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1714;--card:#17221e;--ink:#e8f0ec;--mute:#93a39b;--line:#2a3a34;--accent:#4fd1a5;--accent-ink:#06261b;--warn:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif}
main{max-width:560px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.8rem;margin:0 0 4px}
p.lead{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:12px;flex-wrap:wrap}
label{display:flex;flex-direction:column;gap:4px;flex:1;min-width:120px;font:600 .85rem system-ui,sans-serif;color:var(--mute)}
input{font:1.1rem system-ui,sans-serif;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:600 1rem system-ui,sans-serif;padding:11px 16px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
button.alt{background:transparent;color:var(--ink);border-color:var(--line)}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item b{font-family:system-ui,sans-serif}
.item small{display:block;color:var(--mute);font-family:system-ui,sans-serif}
.empty{color:var(--mute);margin:0}
.note{font:.85rem system-ui,sans-serif;color:var(--mute)}
#ring{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:var(--warn);color:#fff;text-align:center;padding:24px;z-index:9}
#ring.on{display:flex;animation:pulse 1s infinite}
#ring h2{font-size:2.2rem;margin:0}
#ring button{background:#fff;color:#000;border-color:#fff;font-size:1.2rem;padding:14px 28px}
@keyframes pulse{50%{filter:brightness(1.25)}}
@media (prefers-reduced-motion:reduce){#ring.on{animation:none}}
</style>
</head>
<body>
<main>
<h1>Interval alarm</h1>
<p class="lead">Set a repeating alarm, like every 3 minutes for the next hour.</p>

<section class="card">
  <div class="row">
    <label>Ring every (minutes)<input id="every" type="number" min="0.5" step="0.5" value="3"></label>
    <label>For the next (minutes)<input id="total" type="number" min="1" step="1" value="60"></label>
  </div>
  <label style="margin-top:12px">Label (optional)<input id="name" type="text" maxlength="40" placeholder="Stretch break"></label>
  <div class="actions">
    <button id="start">Start alarm</button>
    <button id="test" class="alt">Test sound</button>
  </div>
  <p class="note" style="margin-bottom:0">Keep this tab open. Alarms live only in this page and are gone when you close or refresh it. Nothing is saved or sent anywhere.</p>
</section>

<section class="card">
  <div id="list"></div>
</section>
</main>

<div id="ring" role="alertdialog" aria-live="assertive">
  <h2 id="ringTitle">Alarm</h2>
  <button id="stop">Stop ringing</button>
</div>

<script>
(function(){
  var alarms = [], nextId = 1, ctx = null, keepAlive = null, ringTimer = null, wake = null;
  var $ = function(id){return document.getElementById(id)};

  function audio(){
    if(!ctx){ctx = new (window.AudioContext||window.webkitAudioContext)();}
    if(ctx.state === 'suspended'){ctx.resume();}
    // A silent tone keeps the tab from being throttled in the background.
    if(!keepAlive){
      var o = ctx.createOscillator(), g = ctx.createGain();
      g.gain.value = 0.0001; o.connect(g); g.connect(ctx.destination); o.start();
      keepAlive = o;
    }
  }
  function beep(){
    if(!ctx) return;
    var t = ctx.currentTime;
    for(var i=0;i<3;i++){
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'square'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t+i*0.35);
      g.gain.exponentialRampToValueAtTime(0.3, t+i*0.35+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t+i*0.35+0.25);
      o.connect(g); g.connect(ctx.destination);
      o.start(t+i*0.35); o.stop(t+i*0.35+0.3);
    }
  }
  function ring(a){
    $('ringTitle').textContent = (a.name || 'Alarm') + ' · ' + a.fired + ' of ' + a.count;
    $('ring').classList.add('on');
    beep(); clearInterval(ringTimer); ringTimer = setInterval(beep, 1300);
    if(navigator.vibrate) navigator.vibrate([300,150,300]);
    if('Notification' in window && Notification.permission === 'granted'){
      try{new Notification(a.name || 'Alarm',{body:'Alarm '+a.fired+' of '+a.count})}catch(e){}
    }
    document.title = '⏰ ' + (a.name || 'Alarm');
  }
  function stopRing(){
    clearInterval(ringTimer); $('ring').classList.remove('on'); document.title = 'Interval Alarm';
  }
  function fmt(ms){
    var s = Math.max(0, Math.round(ms/1000)), m = Math.floor(s/60);
    return m + ':' + String(s%60).padStart(2,'0');
  }
  function clock(ts){return new Date(ts).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}

  function render(){
    var el = $('list');
    if(!alarms.length){el.innerHTML = '<p class="empty">No alarms running. Set one above and press Start alarm.</p>'; return;}
    el.innerHTML = '';
    alarms.forEach(function(a){
      var d = document.createElement('div'); d.className = 'item';
      var left = document.createElement('div');
      var done = a.fired >= a.count;
      left.innerHTML = '<b></b><small></small>';
      left.firstChild.textContent = (a.name || 'Alarm') + ': every ' + a.every + ' min for ' + a.total + ' min';
      left.lastChild.textContent = done ? 'Finished. All ' + a.count + ' alarms rang.'
        : 'Next in ' + fmt(a.next - Date.now()) + ' (' + clock(a.next) + '). ' + a.fired + ' of ' + a.count + ' rung, ends ' + clock(a.end) + '.';
      var b = document.createElement('button'); b.className = 'alt';
      b.textContent = done ? 'Remove' : 'Cancel';
      b.onclick = function(){alarms = alarms.filter(function(x){return x.id !== a.id}); render();};
      d.appendChild(left); d.appendChild(b); el.appendChild(d);
    });
  }

  function tick(){
    var now = Date.now(), fire = null;
    alarms.forEach(function(a){
      while(a.fired < a.count && now >= a.next){
        a.fired++; a.next = a.start + (a.fired + 1) * a.every * 60000; fire = a;
      }
    });
    if(fire) ring(fire);
    render();
  }

  $('start').onclick = function(){
    var every = parseFloat($('every').value), total = parseFloat($('total').value);
    if(!(every > 0) || !(total > 0)){alert('Enter an interval and a duration greater than 0.'); return;}
    if(every > total){alert('The interval can’t be longer than the total time.'); return;}
    audio();
    if('Notification' in window && Notification.permission === 'default'){Notification.requestPermission();}
    if(navigator.wakeLock && !wake){navigator.wakeLock.request('screen').then(function(w){wake = w; w.addEventListener('release',function(){wake=null})}).catch(function(){});}
    var start = Date.now();
    alarms.push({
      id: nextId++, name: $('name').value.trim(), every: every, total: total,
      start: start, end: start + total*60000, count: Math.floor(total/every + 1e-9),
      fired: 0, next: start + every*60000
    });
    render();
  };
  $('test').onclick = function(){audio(); beep();};
  $('stop').onclick = stopRing;
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden && !wake && alarms.length && navigator.wakeLock){
      navigator.wakeLock.request('screen').then(function(w){wake = w; w.addEventListener('release',function(){wake=null})}).catch(function(){});
    }
  });
  setInterval(tick, 500);
  render();
})();
</script>
</body>
</html>
